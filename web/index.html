<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RDC</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0b0b0d">
<style>
  /* One look for the viewer, the landing (site/) and the app windows: a black stage, glass
     controls, white for the one main action, blue only for what is live or focused. */
  :root {
    color-scheme: dark;
    --bg: #0b0b0d; --text: #fff; --muted: rgba(255,255,255,.6); --faint: rgba(255,255,255,.36);
    --glass: rgba(30,30,34,.6); --line: rgba(255,255,255,.1); --fill: rgba(255,255,255,.09);
    --accent: #4a8dff; --danger: #ff453a; --blur: blur(28px) saturate(1.8);
    --spring: cubic-bezier(.34,1.4,.64,1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif; letter-spacing: -.005em; overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  button { border: 0; padding: 0; background: none; cursor: pointer; touch-action: manipulation; }
  svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid rgba(255,255,255,.7); outline-offset: 2px; }
  .glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px var(--line), 0 12px 40px rgba(0,0,0,.4); }

  /* Join */
  #join { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  #join::before { content: ''; position: absolute; left: 50%; top: 38%; width: min(120vmin, 820px); aspect-ratio: 1; translate: -50% -50%; border-radius: 50%; pointer-events: none; filter: blur(56px); background: radial-gradient(circle at 40% 36%, rgba(74,141,255,.34), rgba(31,79,214,.14) 44%, transparent 68%); animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { translate: -45% -55%; scale: 1.1; } }
  @media (prefers-reduced-motion: reduce) { #join::before { animation: none; } }
  .card { position: relative; width: min(340px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .card img { width: 64px; height: 64px; border-radius: 15px; margin-bottom: 18px; box-shadow: 0 10px 34px rgba(31,79,214,.35); }
  .card h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 650; letter-spacing: -.03em; }
  .card p { margin: 6px 0 22px; color: var(--muted); }
  .field { position: relative; width: 100%; }
  #code { width: 100%; height: 56px; padding: 0 56px; border: 0; border-radius: 28px; background: var(--fill); outline: 0; text-align: center; font: 600 22px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 1px; transition: background-color .2s ease, box-shadow .2s ease; }
  #code::placeholder { color: var(--faint); font-weight: 500; }
  #code:focus { background: rgba(255,255,255,.13); box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
  #code.link { font: 500 15px/1 inherit; letter-spacing: 0; padding-left: 22px; text-align: left; }
  .field button { position: absolute; right: 7px; top: 7px; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #000; transition: scale .25s var(--spring); }
  .field button:active { scale: .92; }
  #err { min-height: 20px; margin-top: 14px; color: #ff8a80; font-size: 14px; }
  #err.info { color: var(--muted); }

  /* Session */
  #stage { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; touch-action: none; background: #000; }
  #screen { display: block; outline: none; cursor: default; background: #000; image-rendering: auto; }
  #veil { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; background: rgba(0,0,0,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 16px; font-weight: 500; pointer-events: none; }

  #bar { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -80px); opacity: 0; display: flex; gap: 2px; align-items: center; height: 46px; padding: 0 5px; border-radius: 23px; transition: transform .3s var(--spring), opacity .2s ease; white-space: nowrap; max-width: calc(100% - 16px); z-index: 10; }
  #bar.show { transform: translate(-50%, 0); opacity: 1; }
  #who { padding: 0 6px 0 12px; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  #stat { padding-right: 8px; color: var(--faint); font: 11.5px/1 ui-monospace, "SF Mono", Menlo, monospace; }
  @media (max-width: 760px) { #stat { display: none; } }
  #bar button { height: 36px; min-width: 36px; padding: 0 8px; border-radius: 18px; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.86); transition: background-color .15s ease, scale .25s var(--spring); }
  #bar button:hover { background: var(--fill); }
  #bar button:active { scale: .92; }
  #bar button.on { background: #fff; color: #000; }
  #bar #leave { color: #fff; background: var(--danger); margin-left: 4px; }
  #full .in, :fullscreen #full .out { display: none; }
  :fullscreen #full .in { display: block; }
  #handle { display: none; position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; width: 40px; height: 40px; border-radius: 50%; place-items: center; z-index: 11; }
  @media (pointer: coarse) { #handle { display: grid; } #bar { left: 10px; right: 58px; max-width: none; transform: translateY(-80px); justify-content: flex-end; } #bar.show { transform: none; } #who { flex: 1; } }

  #ai { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; align-items: center; gap: 12px; height: 46px; padding: 0 5px 0 16px; border-radius: 23px; background: rgba(120,20,26,.72); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 0 0 1px rgba(255,120,120,.35), 0 12px 40px rgba(0,0,0,.4); font-size: 14px; font-weight: 500; white-space: nowrap; max-width: calc(100% - 16px); }
  #ai-who { overflow: hidden; text-overflow: ellipsis; }
  #ai button { height: 36px; padding: 0 16px; border-radius: 18px; background: #fff; color: #000; font-size: 13px; font-weight: 600; }

  /* This device's microphone and camera, lent to the computer */
  #media { position: absolute; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(340px, calc(100% - 20px)); padding: 6px 16px; border-radius: 20px; font-size: 15px; z-index: 15; }
  .media-row { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .media-row + .media-row { border-top: 1px solid var(--line); }
  .media-row label { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
  .media-row span { flex: none; }
  .media-row input { order: 2; margin: 0 0 0 auto; flex: none; appearance: none; -webkit-appearance: none; width: 42px; height: 26px; border-radius: 13px; background: rgba(255,255,255,.16); position: relative; cursor: pointer; transition: background-color .2s ease; }
  .media-row input::after { content: ''; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); transition: translate .25s var(--spring); }
  .media-row input:checked { background: #30d158; }
  .media-row input:checked::after { translate: 16px 0; }
  .media-row input:disabled { opacity: .35; cursor: default; }
  .media-row select { order: 1; flex: 1; min-width: 0; max-width: 150px; margin-left: auto; font-size: 13px; color: var(--muted); background: none; border: 0; outline: 0; text-align: right; text-overflow: ellipsis; }
  .media-row label + select { order: 0; }
  #media-note { padding: 10px 0 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.35; }
  #media-note:empty { display: none; }

  /* On-screen keyboard */
  body:not(.live) #osk, body:not(.live) #kbtn { display: none !important; }
  #kbtn { position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 52px; height: 52px; border-radius: 26px; border: 0; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); color: var(--text); font-size: 24px; display: none; align-items: center; justify-content: center; z-index: 20; touch-action: manipulation; }
  @media (pointer: coarse) { #kbtn { display: flex; } }
  #kbtn.hidden { display: none !important; }
  #osk { position: absolute; z-index: 30; width: 640px; --u: 40px; background: rgba(28,28,32,.86); border: 0; border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.55), inset 0 0 0 1px var(--line); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: opacity .15s ease; }
  #osk[hidden] { display: none; }
  #osk.docked { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto !important; border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
  #osk.ghost { opacity: .58; }
  #osk.ghost:active { opacity: .97; }
  .osk-head { display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 6px 0 12px; cursor: grab; }
  .osk-head:active { cursor: grabbing; }
  .osk-grip { width: 34px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); flex: none; }
  .osk-title { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .osk-head button { flex: none; width: 34px; height: 30px; border-radius: 9px; border: 0; background: rgba(255,255,255,.08); color: var(--text); font-size: 15px; line-height: 1; }
  .osk-head button.on { background: #fff; color: #000; }
  .osk-head button.txt { font-size: 12px; font-weight: 600; }
  .osk-cuts { display: flex; gap: 6px; overflow-x: auto; padding: 0 8px 8px; touch-action: pan-x; scrollbar-width: none; }
  .osk-cuts::-webkit-scrollbar { display: none; }
  .osk-cuts button { flex: none; height: 32px; padding: 0 11px; border-radius: 9px; border: 0; background: rgba(255,255,255,.08); color: var(--text); font: 500 12.5px/1 inherit; white-space: nowrap; }
  .osk-cuts button b { font-weight: 600; margin-right: 6px; }
  .osk-cuts button:active { background: var(--accent); border-color: var(--accent); }
  .osk-keys { display: flex; flex-direction: column; gap: calc(var(--u) * .14); padding: 0 8px 10px; }
  .osk-row { display: flex; gap: calc(var(--u) * .12); }
  .osk-key { flex: 1 1 0; min-width: 0; height: calc(var(--u) * 1.25); min-height: 36px; border: 0; border-radius: calc(var(--u) * .18); background: rgba(255,255,255,.14); color: var(--text); font: 500 calc(var(--u) * .5)/1 -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; position: relative; padding: 0; box-shadow: 0 1px 0 rgba(0,0,0,.45); }
  .osk-key.sp { visibility: hidden; }
  .osk-key.fn { background: rgba(255,255,255,.08); font-size: calc(var(--u) * .34); }
  .osk-key.down { background: rgba(255,255,255,.3); transform: translateY(1px); box-shadow: none; }
  .osk-key.armed { background: var(--accent); color: #fff; }
  .osk-key.locked { background: #fff; color: #000; }
  .osk-key .alt { position: absolute; top: calc(var(--u) * .1); right: calc(var(--u) * .14); font-size: calc(var(--u) * .25); color: var(--faint); font-weight: 400; }
  .osk-key.armed .alt, .osk-key.locked .alt { color: inherit; opacity: .7; }
  .osk-key[data-mod] { flex-direction: column; gap: 2px; }
  .osk-key small { display: block; font-size: calc(var(--u) * .2); opacity: .7; }
  .osk-size { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; cursor: nwse-resize; touch-action: none; }
  .osk-size::after { content: ''; position: absolute; right: 6px; bottom: 6px; width: 9px; height: 9px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); border-radius: 0 0 3px 0; }
  #osk.docked .osk-size { display: none; }
  #osk.docked .osk-keys, #osk.docked .osk-cuts { max-width: 980px; margin: 0 auto; }
  #osk-bubble { position: absolute; z-index: 40; display: none; min-width: 44px; height: 54px; padding: 0 10px; border-radius: 12px; background: #48484e; color: #fff; font: 600 28px/54px -apple-system, system-ui, sans-serif; text-align: center; pointer-events: none; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-go" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><path d="M5.5 12h.01M12 12h.01M18.5 12h.01" stroke-width="2.6"/></symbol>
</svg>
<div id="join">
  <form class="card" id="form" autocomplete="off">
    <img src="icon.png" alt="">
    <h1>RDC</h1>
    <p id="hint">Code from the RDC window</p>
    <div class="field">
      <input id="code" inputmode="numeric" placeholder="123 456 789" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      <button type="submit" aria-label="Connect"><svg><use href="#i-go"/></svg></button>
    </div>
    <div id="err"></div>
  </form>
</div>
<div id="stage">
  <canvas id="screen" tabindex="0"></canvas>
  <div id="veil">Reconnecting…</div>
  <div id="ai"><span id="ai-who"></span><button id="ai-stop">Stop</button></div>
  <button id="handle" class="glass" aria-label="Toolbar"><svg><use href="#i-more"/></svg></button>
  <div id="bar" class="glass">
    <span id="who"></span>
    <span id="stat"></span>
    <button id="disp" style="display:none" title="Show the next display">Display 1/2</button>
    <button id="swap" title="Ctrl on this computer acts as ⌘ on the Mac">Ctrl → ⌘</button>
    <button id="kbd" title="Keyboard" aria-label="Keyboard"><svg><use href="#i-keys"/></svg></button>
    <button id="media-btn" title="Microphone and camera" aria-label="Microphone and camera"><svg><use href="#i-mic"/></svg></button>
    <button id="full" title="Full screen" aria-label="Full screen"><svg class="out"><use href="#i-out"/></svg><svg class="in"><use href="#i-in"/></svg></button>
    <button id="leave" title="Disconnect (Esc)" aria-label="Disconnect"><svg><use href="#i-x"/></svg></button>
  </div>
  <div id="media" class="glass" hidden>
    <div class="media-row" id="media-mic-row"><label><input type="checkbox" id="media-mic"><span>Microphone</span></label><select id="media-mic-dev" hidden></select></div>
    <div class="media-row" id="media-cam-row"><label><input type="checkbox" id="media-cam"><span>Camera</span></label><select id="media-cam-dev" hidden></select></div>
    <div class="media-row" id="media-q-row"><label><span>Quality</span></label><select id="media-cam-q"><option value="light">Light</option><option value="hd">HD</option></select></div>
    <div id="media-note"></div>
  </div>
</div>
<button id="kbtn" aria-label="Show keyboard"><svg><use href="#i-keys"/></svg></button>
<div id="osk" hidden>
  <div class="osk-head" id="osk-head">
    <div class="osk-grip" aria-hidden="true"></div>
    <div class="osk-title" id="osk-title">Keyboard</div>
    <button data-act="lang" class="txt" title="Key labels: Latin or Cyrillic">EN</button>
    <button data-act="ghost" title="Transparency">◐</button>
    <button data-act="dock" title="Dock to bottom">⤓</button>
    <button data-act="hide" title="Hide">✕</button>
  </div>
  <div class="osk-cuts" id="osk-cuts"></div>
  <div class="osk-keys" id="osk-keys"></div>
  <div class="osk-size" id="osk-size" title="Resize"></div>
</div>
<div id="osk-bubble"></div>
<script src="viewer.js"></script>
</body>
</html>
