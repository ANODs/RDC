# RDC relay (relay/README.md). Deploy: cd relay && npx wrangler deploy
name = "rdc-relay"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Pages that may use the relay from a browser, space-separated; RDC itself needs no entry.
[vars]
ORIGINS = "https://anods.github.io https://rdc.timoshkin.dev"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
